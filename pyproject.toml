[project]
name = "conciliacion"
version = "0.1.0"
description = "Conciliación contable Wompi ↔ Bancolombia ↔ Odoo (Alimentos Alcázar)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
conciliacion = "conciliacion.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conciliacion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
