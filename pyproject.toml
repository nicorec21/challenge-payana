[project]
name = "conciliacion"
version = "0.1.0"
description = "Conciliación contable Wompi ↔ Bancolombia ↔ Odoo (Alimentos Alcázar)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
# `dev` arrastra `api` a propósito: `tests/test_report_api.py` levanta la API
# con `TestClient`, así que sin fastapi esos tests no fallan — *erroran* al
# construir el fixture, y el que sigue el README (`pip install -e ".[dev]"`)
# se come diez errores que no son suyos. Dejarlos fuera y saltearlos sería
# peor: la API es un entregable y quedaría sin cubrir en CI.
dev = ["conciliacion[api]", "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
conciliacion = "conciliacion.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conciliacion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# `network` queda fuera de la corrida por defecto: la suite no debe depender de
# una API productiva ni de credenciales. El bloqueo se hace cumplir en
# tests/conftest.py, no solo por convención.
addopts = "-m 'not network' --strict-markers"
markers = [
    "unit: solo dominio — sin filesystem, sin base, sin parsers",
    "integration: pipeline real sobre fixtures congelados",
    "network: requiere red y credenciales. Excluido por defecto.",
]

[tool.coverage.run]
source = ["src/conciliacion"]
branch = true

[tool.coverage.report]
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # el largo lo controla el formatter, no el linter
    "B008",   # Typer usa llamadas en defaults por diseño
    "SIM108", # el ternario no siempre lee mejor
]

[tool.ruff.lint.per-file-ignores]
# Los tests importan símbolos privados a propósito: verifican invariantes
# internos (`_verify`, `_Row`) que no forman parte de la API pública.
"tests/*" = ["F401"]
