name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"   # los fixtures y mensajes llevan acentos

jobs:
  test:
    name: Tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mínima soportada y actual. Si una falla, se ve cuál sin adivinar.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"

      # ruff no depende de la versión de Python: corre una sola vez.
      - name: Lint
        if: matrix.python == '3.13'
        run: ruff check --output-format=github .

      # Separados en steps y no en jobs: la suite entera tarda ~9s, así que un
      # runner extra costaría más setup que los tests que ahorra. Como steps se
      # conserva la señal de cuál rompió.
      - name: Unit (solo dominio)
        run: pytest -m unit -q

      - name: Integration (pipeline sobre fixtures)
        run: pytest -m integration -q

      - name: Cobertura
        if: matrix.python == '3.13'
        run: pytest --cov --cov-report=term-missing

  smoke:
    name: Corre recién clonado
    runs-on: ubuntu-latest
    # Job aparte a propósito: instala SIN dependencias de desarrollo y sin
    # credenciales, que es la situación de quien clona el repositorio. Si
    # alguien introduce una dependencia oculta a `.env` o a la API de Wompi en
    # el camino offline, los tests seguirían pasando y esto no.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .

      - name: No hay .env en el repo
        run: |
          if [ -f .env ]; then
            echo "::error::.env fue commiteado. Contiene credenciales."
            exit 1
          fi

      - name: Ingesta offline de los extractos versionados
        run: conciliacion ingest bancolombia --offline --strict

      - name: El ledger persistido tiene lo que debe
        run: |
          conciliacion show bancolombia | tee salida.txt
          grep -q "426" salida.txt || {
            echo "::error::Se esperaban 426 movimientos en los 4 extractos."
            exit 1
          }

      - name: Reingerir no duplica
        run: |
          conciliacion ingest bancolombia --offline --strict | tee segunda.txt
          grep -q "(0 nuevos en la base)" segunda.txt || {
            echo "::error::La segunda ingesta creó movimientos: se rompió la idempotencia."
            exit 1
          }

      - name: Las fuentes se declaran sin credenciales
        run: conciliacion sources --offline

      # Los connectors de red quedan cubiertos por el replay de sus payloads
      # archivados en data/raw/ (versionados, ya redactados): un clon fresco
      # reconstruye TODOS los ledgers sin credenciales.
      - name: Ingesta offline del resto (replay del archivo)
        run: |
          conciliacion ingest wompi --offline --strict
          conciliacion ingest wompi_erp --offline --strict --desde 2025-01-01 --hasta 2026-12-31
          conciliacion ingest bancolombia_erp --offline --strict --desde 2025-01-01 --hasta 2026-12-31

      - name: La conciliación completa corre sin red
        run: |
          conciliacion reconcile
          conciliacion reconcile-erp wompi
          conciliacion reconcile-erp bancolombia

      # docs/salida/ es la copia versionada de las salidas sobre los datos del
      # challenge. Si un cambio mueve la conciliación y no actualiza la copia,
      # el repo le muestra al lector un resultado que el código ya no produce.
      # Se ignora `generated_at` (marca de la corrida, no del resultado).
      - name: Las salidas versionadas están al día
        run: |
          python - <<'EOF'
          import json, pathlib, sys

          out, ref = pathlib.Path("data/out"), pathlib.Path("docs/salida")
          desactualizados = []
          for path in sorted(ref.glob("conciliacion-*")):
              gen = out / path.name
              if path.suffix == ".json":
                  a = json.loads(gen.read_text(encoding="utf-8"))
                  b = json.loads(path.read_text(encoding="utf-8"))
                  for d in (a, b):
                      d.pop("generated_at", None)
                  same = a == b
              else:
                  same = gen.read_text(encoding="utf-8") == path.read_text(encoding="utf-8")
              print(("OK   " if same else "DIFF ") + path.name)
              if not same:
                  desactualizados.append(path.name)
          if desactualizados:
              print("::error::La salida generada no coincide con docs/salida/. "
                    "Regenerá (reconcile, reconcile-erp wompi, reconcile-erp bancolombia) "
                    "y copiá data/out/ a docs/salida/ en este mismo cambio: "
                    + ", ".join(desactualizados))
              sys.exit(1)
          EOF
