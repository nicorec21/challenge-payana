name: CI

on:
  pull_request:
  push:
    branches: [main, master]

# Una corrida por rama: un push nuevo cancela la anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"   # los fixtures y mensajes llevan acentos

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check --output-format=github .

  unit:
    name: Unit (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mínima soportada y actual. Si una falla, se ve cuál sin adivinar.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tests unitarios (solo dominio)
        run: pytest -m unit -q

  integration:
    name: Integration (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tests de integración (pipeline sobre fixtures)
        run: pytest -m integration -q

  coverage:
    name: Cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Suite completa con cobertura
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  smoke:
    name: Corre recién clonado
    runs-on: ubuntu-latest
    # Verifica la afirmación del README: `git clone` + install + correr, sin
    # credenciales ni red. Si alguien mete una dependencia oculta a `.env` o a
    # la API de Wompi en el camino offline, este job lo detecta y los tests no.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .

      - name: No hay .env en el repo
        run: |
          if [ -f .env ]; then
            echo "::error::.env fue commiteado. Contiene credenciales."
            exit 1
          fi

      - name: Ingesta offline de los extractos versionados
        run: conciliacion ingest bancolombia --offline --strict

      - name: El ledger persistido tiene lo que debe
        run: |
          conciliacion show bancolombia | tee salida.txt
          grep -q "426" salida.txt || {
            echo "::error::Se esperaban 426 movimientos en los 4 extractos."
            exit 1
          }

      - name: Reingerir no duplica
        run: |
          conciliacion ingest bancolombia --offline --strict | tee segunda.txt
          grep -q "(0 nuevos en la base)" segunda.txt || {
            echo "::error::La segunda ingesta creó movimientos: se rompió la idempotencia."
            exit 1
          }

      - name: Las fuentes se declaran sin credenciales
        run: conciliacion sources --offline
